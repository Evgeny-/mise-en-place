<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food review</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #f3dcb8; --ink: #2b2140; --muted: #7a6450; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font: 600 13px/1.25 "Nunito Variable", system-ui, sans-serif; }
    header { padding: 14px 16px 2px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; }
    header .stats { color: var(--muted); font-weight: 600; }
    h2 { margin: 14px 16px 8px; font-size: 14px; }
    h2 small { color: var(--muted); font-weight: 600; margin-left: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px 8px; padding: 0 16px; align-items: flex-end; }
    .row.tight { gap: 4px; }
    .cell { display: flex; flex-direction: column; align-items: center; }
    .view { border-radius: 10px; }
    .label { margin-top: 3px; text-align: center; white-space: nowrap; }
    .label small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
    .over { color: #c0262d; }
    #gl { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <header><h1>Mise en Place · food</h1><span class="stats" id="stats"></span></header>
  <main id="sections"></main>
  <div id="gl"></div>
  <script type="module" src="./food.ts"></script>
</body>
</html>
