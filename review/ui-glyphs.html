<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mise en Place: glyph sheet</title>
<style>
  body { margin: 0; padding: 16px; font: 12px/1.3 system-ui; }
  .sheet { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; padding: 14px; border-radius: 12px; margin-bottom: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .light { background: #fbf3e4; color: #3b2a20; }
  .dark { background: #2b221d; color: #f6ead6; }
  .btns { background: #fbf3e4; }
  .pill { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: #fff8ea; }
  .mono .t { fill: currentColor; fill-opacity: .24; }
  .mono .hl { display: none; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  import { GLYPHS, glyph } from '../src/ui/glyphs.ts';
  const names = Object.keys(GLYPHS);
  const sheet = (cls) => `<div class="sheet ${cls}">` + names.map((n) => `<div class="cell"><div class="row">${glyph(n, 16)}${glyph(n, 24)}${glyph(n, 40)}</div><span>${n}</span></div>`).join('') + '</div>';
  const mono = `<div class="sheet btns">` + names.map((n, i) => `<div class="cell"><span class="pill" style="background:${['#e8553f', '#3f9a52', '#2b6f8f', '#3b2a20'][i % 4]}">${glyph(n, 26, 'mono')}</span><span>${n}</span></div>`).join('') + '</div>';
  document.getElementById('out').innerHTML = sheet('light') + sheet('dark') + mono;
</script>
</body>
</html>
