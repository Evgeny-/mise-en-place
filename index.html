    <!-- the loading moment: inline, so it plays before any script, font or 3D loads (src/ui/loading.ts takes it over) -->
    <style>
  .boot { --paper: #fbf3e4; --ink: #3b2a20; --ink-2: #7c5e49; position: absolute; inset: 0; z-index: 200; display: grid; place-items: center; align-content: center; gap: 6px; padding-bottom: min(22vh, 150px); transition: opacity .4s;
    background: radial-gradient(circle at 50% 40%, #fffaf0 0, #fbf3e4 45%, #f3e1c4 100%); color: var(--ink); font-family: 'Vollkorn Variable', Vollkorn, Georgia, serif; overflow: hidden; }
  .boot.out { opacity: 0; pointer-events: none; }
  .boot::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: min(20%, 140px);
    background: linear-gradient(90deg, rgba(255,250,240,.75) 2px, transparent 2px) 0 0 / 34px 34px, linear-gradient(rgba(255,250,240,.75) 2px, transparent 2px) 0 0 / 34px 34px, #efb68c;
    border-top: 3px solid var(--ink); opacity: .55; }
  .boot-art { position: relative; z-index: 1; width: 264px; height: 209px; overflow: visible; }
  .boot-title { position: relative; z-index: 1; margin: 2px 0 0; font-size: 36px; font-weight: 900; line-height: 1; letter-spacing: .5px; white-space: nowrap; }
  .boot-title span { display: inline-block; animation: boot-settle .7s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(.25s + var(--i) * 45ms); }
  .boot-sub { position: relative; z-index: 1; margin: 6px 0 0; font: 700 11px/1 'Jost Variable', Jost, system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); min-height: 11px; }
  @keyframes boot-settle { from { opacity: 0; transform: translateY(-26px) rotate(-8deg); } }
  .boot g, .boot path, .boot ellipse, .boot circle { transform-box: fill-box; }
  /* two tomatoes drop onto the plate and puff into sauce: the game's one rule */
  .boot .tom { transform-origin: 50% 100%; }
  .boot .t1 { animation: t1 3.4s cubic-bezier(.4, 0, .2, 1) infinite; }
  .boot .t2 { animation: t2 3.4s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes t1 { 0% { transform: translate(0, -170px); opacity: 1; } 11% { transform: translate(0, 0) scale(1.12, .84); } 16% { transform: translate(0, -12px) scale(.96, 1.05); } 20%, 34% { transform: translate(0, 0) scale(1); }
    44% { transform: translate(24px, 0) scale(.75); opacity: 1; } 46%, 100% { transform: translate(24px, 0) scale(.4); opacity: 0; } }
  @keyframes t2 { 0%, 14% { transform: translate(0, -170px); opacity: 1; } 25% { transform: translate(0, 0) scale(1.12, .84); } 30% { transform: translate(0, -12px) scale(.96, 1.05); } 34% { transform: translate(0, 0) scale(1); }
    44% { transform: translate(-24px, 0) scale(.75); opacity: 1; } 46%, 100% { transform: translate(-24px, 0) scale(.4); opacity: 0; } }
  .boot .puff { transform-origin: 50% 60%; animation: puff 3.4s ease-out infinite; }
  @keyframes puff { 0%, 42% { transform: scale(.2); opacity: 0; } 47% { opacity: 1; } 58% { transform: scale(1.25); opacity: 0; } 100% { opacity: 0; } }
  .boot .pot { transform-origin: 50% 100%; animation: pot 3.4s cubic-bezier(.2, 1.5, .4, 1) infinite; }
  @keyframes pot { 0%, 46% { transform: scale(0); opacity: 0; } 54% { transform: scale(1.08); opacity: 1; } 60%, 90% { transform: scale(1); opacity: 1; } 97%, 100% { transform: scale(.9) translateY(4px); opacity: 0; } }
  .boot .steam { stroke-dasharray: 26; animation: steam 3.4s ease-in-out infinite; }
  .boot .steam:nth-of-type(2) { animation-delay: .15s; }
  .boot .steam:nth-of-type(3) { animation-delay: .3s; }
  @keyframes steam { 0%, 56% { stroke-dashoffset: 26; opacity: 0; transform: translateY(6px); } 70% { stroke-dashoffset: 0; opacity: .9; } 90% { opacity: .9; transform: translateY(-6px); } 100% { opacity: 0; transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) {
    .boot *, .boot *::before { animation: none !important; }
    .boot .t1, .boot .t2, .boot .puff, .boot .steam { opacity: 0; }
  }
  @media (prefers-color-scheme: dark) {
    .boot { --paper: #2f2a3a; --ink: #f7ecdb; --ink-2: #cfc1b0; background: radial-gradient(circle at 50% 40%, #3b3448 0, #2f2a3a 45%, #221e2b 100%); }
    .boot::after { opacity: .3; border-color: #120f1a; }
    .boot .ol { stroke: #120f1a; }
  }
  html.night .boot { --paper: #2f2a3a; --ink: #f7ecdb; --ink-2: #cfc1b0; background: radial-gradient(circle at 50% 40%, #3b3448 0, #2f2a3a 45%, #221e2b 100%); }
  html.night .boot::after { opacity: .3; border-color: #120f1a; }
    </style>
  </head>
  <body>

troke="#3b2a20" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></ellipse><ellipse cx="108" cy="120" rx="9" ry="3" fill="#ff8a70" opacity=".8"></ellipse><path d="M162 128h18" class="ol" stroke="#3b2a20" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path><path d="M162 128h18" stroke="#c9a27a" stroke-width="2.5" stroke-linecap="round"></path><path d="M118 117l-4-4 5 1 1-5 2 5 5-1-4 4" fill="#5bb062" stroke="#3b2a20" stroke-width="1.5" stroke-linejoin="round"></path></g><g fill="none" stroke="#cdbfae" stroke-width="3.5" stroke-linecap="round"><path class="steam" d="M104 102c-6-7 6-11 0-19"></path><path class="steam" d="M120 98c-6-7 6-11 0-19"></path><path class="steam" d="M136 102c-6-7 6-11 0-19"></path></g></svg><h1 class="boot-title"></h1><p class="boot-sub"></p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
